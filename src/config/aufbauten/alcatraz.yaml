# =====================================================================
# Aufbauten Alcatraz und Alcatraz-DM26
# =====================================================================
# Wird von `npm run config:sync` mit den anderen Dateien zu public/config/positionen.yaml
# zusammengeführt. Parameter: siehe src/config/aufbauten.yaml.

aufbauten:
  - id: alcatraz
    name: Alcatraz
    positionen: [zeit, vorsteg, steg, gate135, gate245, tor5, mueb, parcours]
  - id: alcatrazdm26
    name: Alcatraz-DM26
    positionen: [zeit, zeit, zeit, vorsteg, steg, gate135os, gate245os, tor5, mueb, parcoursms]

positionen:
  # === Aufbau ALCATRAZ: Tor-Positionen (Bild um 90° gedreht) ===
  - id: gate135
    titel: "Tor 1 / 3 / 5"
    menue: "Tore 1 / 3 / 5"
    ausrichtung: hoch
    subTrenner: gepunktet   # gepunktete Linie zwischen den Bojen jedes Tores
    bild: alcatraz_I
    bildGenerator: true    # aus alcatraz_Parcours erzeugt
    # Beobachtet wird nur die seiteA-Hälfte (untere Boje). Neben Tor 2/4 (aus
    # `hebt` abgeleitet) werden daher die OBEREN Bojen von Tor 5 / Start-Ziel, die
    # Schikane (MüB) und die obere Speedboje (7) abgeblendet.
    abblenden: [Tor5_oben, StartZiel_oben, Schikane, Speedboje_oben]
    bildDrehung: 90
    pfeileSpiegeln: true   # Alcatraz = Blick von hinten (Pfeile spiegeln)
    summeSpalte: sum
    disq: parcours
    hinweis: blickrichtung
    spalten:
      - { key: start, label: "Start", typ: boje, sub: ["hin seiteA"] }
      - { key: t1a, label: "Tor 1", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteB, hebt: Tor1 }
      - { key: t3a, label: "Tor 3", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteB, hebt: Tor3 }
      - { key: t5, label: "Tor 5", typ: boje, sub: ["hin seiteA", "rueck seiteA"], subTrenner: doppelt, hebt: Tor5 }
      - { key: t3b, label: "Tor 3", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteB, hebt: Tor3 }
      # Klasse 4 fährt auf der Rückfahrt nicht durch Tor 1.
      - { key: t1b, label: "Tor 1", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteB, hebt: Tor1, klassen: ["E", 1, 2, 3, 5, 6, 7] }
      # Klasse 7: Speedboje 2, danach ein zweites Mal durch Tor 1 (Papierliste Alcatraz 1).
      - { key: speed2, label: "Speed 2", typ: boje, klassen: [7] }
      - { key: t1c, label: "Tor 1", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteB, hebt: Tor1, klassen: [7] }
      - { key: ziel, label: "Ziel", typ: boje, sub: ["rueck seiteA"] }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }

  - id: gate135os
    titel: "Tor 1 / 3 / 5"
    menue: "Tore 1 / 3 / 5 ohne Start/Ziel"
    schnellauswahl: true   # in keinem Aufbau - nur über die Schnellauswahl
    ausrichtung: hoch
    subTrenner: gepunktet   # gepunktete Linie zwischen den Bojen jedes Tores
    bild: alcatraz_I_os     # eigenes Bild: Start/Ziel zusätzlich abgeblendet
    bildGenerator: true    # aus alcatraz_Parcours erzeugt
    # Wie gate135, aber ohne Start/Ziel: neben Tor 2/4 (aus `hebt`) werden die
    # OBERE Boje von Tor 5, BEIDE Start-/Ziel-Bojen, die Schikane (MüB) und die
    # obere Speedboje (7) abgeblendet.
    abblenden: [Tor5_oben, StartZiel, Schikane, Speedboje_oben]
    bildDrehung: 90
    pfeileSpiegeln: true   # Alcatraz = Blick von hinten (Pfeile spiegeln)
    summeSpalte: sum
    disq: parcours
    hinweis: blickrichtung
    spalten:
      - { key: t1a, label: "Tor 1", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteB, hebt: Tor1 }
      - { key: t3a, label: "Tor 3", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteB, hebt: Tor3 }
      - { key: t5, label: "Tor 5", typ: boje, sub: ["hin seiteA", "rueck seiteA"], subTrenner: doppelt, hebt: Tor5 }
      - { key: t3b, label: "Tor 3", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteB, hebt: Tor3 }
      # Klasse 4 fährt auf der Rückfahrt nicht durch Tor 1.
      - { key: t1b, label: "Tor 1", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteB, hebt: Tor1, klassen: ["E", 1, 2, 3, 5, 6, 7] }
      # Klasse 7: Speedboje 2, danach ein zweites Mal durch Tor 1 (Papierliste Alcatraz 1).
      - { key: speed2, label: "Speed 2", typ: boje, klassen: [7] }
      - { key: t1c, label: "Tor 1", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteB, hebt: Tor1, klassen: [7] }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }

  - id: gate245
    titel: "Tor 2 / 4 / 5"
    menue: "Tore 2 / 4 / 5"
    ausrichtung: hoch
    subTrenner: gepunktet   # gepunktete Linie zwischen den Bojen jedes Tores
    bild: alcatraz_II
    bildGenerator: true    # aus alcatraz_Parcours erzeugt
    # Beobachtet wird nur die seiteB-Hälfte (obere Boje). Neben Tor 1/3 (aus
    # `hebt`) werden die UNTEREN Bojen von Tor 5 / Start-Ziel, die Schikane (MüB)
    # und die untere Speedboje (8) abgeblendet.
    abblenden: [Tor5_unten, StartZiel_unten, Schikane, Speedboje_unten]
    bildDrehung: 90
    pfeileSpiegeln: true   # Alcatraz = Blick von hinten (Pfeile spiegeln)
    summeSpalte: sum
    disq: parcours
    hinweis: blickrichtung
    spalten:
      - { key: start, label: "Start", typ: boje, sub: ["hin seiteB"] }
      - { key: t2a, label: "Tor 2", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteA, hebt: Tor2 }
      - { key: t4a, label: "Tor 4", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteA, hebt: Tor4 }
      - { key: t5, label: "Tor 5", typ: boje, sub: ["hin seiteB", "rueck seiteB"], subTrenner: doppelt, hebt: Tor5 }
      - { key: t4b, label: "Tor 4", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteA, hebt: Tor4 }
      - { key: t2b, label: "Tor 2", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteA, hebt: Tor2 }
      # Speedboje nur ab Klasse 5 (Kl. 7: „Sp. 1“ laut Papierliste Alcatraz 2).
      - { key: speed1, label: "Speed 1", typ: boje, klassen: [5, 6, 7] }
      - { key: ziel, label: "Ziel", typ: boje, sub: ["rueck seiteB"] }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }

  - id: gate245os
    titel: "Tor 2 / 4 / 5"
    menue: "Tore 2 / 4 / 5 ohne Start/Ziel"
    schnellauswahl: true   # in keinem Aufbau - nur über die Schnellauswahl
    ausrichtung: hoch
    subTrenner: gepunktet   # gepunktete Linie zwischen den Bojen jedes Tores
    bild: alcatraz_II_os    # eigenes Bild: Start/Ziel zusätzlich abgeblendet
    bildGenerator: true    # aus alcatraz_Parcours erzeugt
    # Wie gate245, aber ohne Start/Ziel: neben Tor 1/3 (aus `hebt`) werden die
    # UNTERE Boje von Tor 5, BEIDE Start-/Ziel-Bojen, die Schikane (MüB) und die
    # untere Speedboje (8) abgeblendet.
    abblenden: [Tor5_unten, StartZiel, Schikane, Speedboje_unten]
    bildDrehung: 90
    pfeileSpiegeln: true   # Alcatraz = Blick von hinten (Pfeile spiegeln)
    summeSpalte: sum
    disq: parcours
    hinweis: blickrichtung
    spalten:
      - { key: t2a, label: "Tor 2", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteA, hebt: Tor2 }
      - { key: t4a, label: "Tor 4", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteA, hebt: Tor4 }
      - { key: t5, label: "Tor 5", typ: boje, sub: ["hin seiteB", "rueck seiteB"], subTrenner: doppelt, hebt: Tor5 }
      - { key: t4b, label: "Tor 4", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteA, hebt: Tor4 }
      - { key: t2b, label: "Tor 2", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteA, hebt: Tor2 }
      # Speedboje nur ab Klasse 5 (Kl. 7: „Sp. 1“ laut Papierliste Alcatraz 2).
      - { key: speed1, label: "Speed 1", typ: boje, klassen: [5, 6, 7] }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }

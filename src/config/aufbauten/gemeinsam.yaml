# =====================================================================
# Gemeinsame Positionen (in jedem Aufbau gleich)
# =====================================================================
# Wird von `npm run config:sync` mit den anderen Dateien zu public/config/positionen.yaml
# zusammengeführt. Parameter: siehe src/config/aufbauten.yaml.

# Eine Disziplin bündelt Aufbauten, die sich die Eingaben teilen: Parallelslalom hat eigene
# Werte, die beim Wechsel zu Manövrieren und zurück erhalten bleiben. `ergebnisspalten` legt
# die Spalten der Ergebnislisten fest, in der Reihenfolge des Fahrwegs.
disziplinen:
  - id: manoevrieren
    name: Manövrieren
    ergebnisspalten:
      - { label: "Steg AB", felder: ["katalog:stegAblegen"] }
      - { label: "Start", felder: ["start|hin seiteA", "start|hin seiteB"] }
      - { label: "1 H", unter: ["t1a|hin seiteB", "t1a|hin seiteA"] }
      - { label: "2 H", unter: ["t2a|hin seiteB", "t2a|hin seiteA"] }
      - { label: "3 H", unter: ["t3a|hin seiteB", "t3a|hin seiteA"] }
      - { label: "4 H", unter: ["t4a|hin seiteB", "t4a|hin seiteA"] }
      - label: "5"
        unter:
          - "t5|hin seiteB"
          - "t5|hin seiteA"
          - { label: "E", feld: "katalog:tor5" }
          - "t5|rueck seiteB"
          - "t5|rueck seiteA"
      - { label: "4 R", unter: ["t4b|rueck seiteB", "t4b|rueck seiteA"] }
      - { label: "3 R", unter: ["t3b|rueck seiteB", "t3b|rueck seiteA"] }
      - { label: "2 R", unter: ["t2b|rueck seiteB", "t2b|rueck seiteA"] }
      - { label: "1 R", unter: ["t1b|rueck seiteB", "t1b|rueck seiteA"] }
      # Die DM-Liste 2026 nennt Mann-über-Bord noch „SCH“ und setzt S1 vor „1 R“. Gefahren
      # wird aber: Tor 1, Mann-über-Bord, Speedrunde (S1, bei Kl. 7 S2), bei Kl. 7 noch einmal Tor 1.
      - { label: "MüB", felder: ["katalog:mueb"] }
      - { label: "S1", felder: [speed1] }
      - { label: "S2", felder: [speed2] }
      - { label: "1 R", unter: ["t1c|rueck seiteB", "t1c|rueck seiteA"] }
      - { label: "Ziel", felder: ["ziel|rueck seiteA", "ziel|rueck seiteB"] }
      - { label: "Steg AN", felder: ["katalog:stegAnlegen"] }

positionen:
  - id: zeit
    titel: "Zeit"
    menue: "Zeitnahme"
    ausrichtung: hoch
    spalten:
      - { key: zeit1, label: "Zeit 1", typ: zeit }
      - { key: zeit2, label: "Zeit 2", typ: zeit }
      - { key: zeit3, label: "Zeit 3", typ: zeit }

  - id: steg
    titel: "Steg"
    menue: "Steg (Ablegen / Anlegen)"
    ausrichtung: hoch
    summeSpalte: sum
    disq: steg
    # Zwei getrennte Fehler-Spalten mit je eigenem Katalog (per-Spalte statt
    # position-weit). Jede Spalte lässt nur ihre Codes + Disqualifikationen zu.
    spalten:
      - { key: fehlerAB, label: "Fehler AB", typ: code, punkteSpalte: fpab, katalog: stegAblegen, breite: 1 }
      - { key: fpab, label: "F-Pkt. AB", typ: summe, einzeln: true }
      - { typ: trenner, design: "doppelt" }
      - { key: fehlerAN, label: "Fehler AN", typ: code, punkteSpalte: fpan, katalog: stegAnlegen, breite: 1 }
      - { key: fpan, label: "F-Pkt. AN", typ: summe, einzeln: true }
      - { typ: trenner, design: "doppelt" }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }
      - { key: bemerkung, label: "Bemerkung", typ: text, breite: 2 }

  - id: vorsteg
    titel: "Vorsteg"
    menue: "Vorsteg"
    schnellauswahl: true   # in keinem Aufbau - nur über die Schnellauswahl
    ausrichtung: hoch
    disq: vorsteg
    # Zwei getrennte Fehler-Spalten mit je eigenem Katalog (per-Spalte statt
    # position-weit). Jede Spalte lässt nur ihre Codes + Disqualifikationen zu.
    spalten:
      - { key: disq, label: "Disq.", typ: disq }
      - { key: bemerkung, label: "Bemerkung", typ: text, breite: 2 }

  - id: tor5
    titel: "Tor 5"
    menue: "Tor 5 (Einfahrt)"
    ausrichtung: hoch
    summeSpalte: sum
    disq: parcours
    katalog: tor5
    spalten:
      - { key: fehler, label: "Fehler", typ: code, punkteSpalte: fp, breite: 1 }
      - { key: fp, label: "Fehlerpunkte", typ: summe, einzeln: true }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }
      - { key: bemerkung, label: "Bemerkung", typ: text, breite: 3 }

  # Option „Tor 5 übernimmt die Parcoursüberwachung“: Eine Person macht beides, die
  # extra Parcoursliste entfällt. `ersetzt` legt fest, in welchen Aufbauten das geht.
  - id: tor5pue
    titel: "Tor 5 + Parcours"
    menue: "Tor 5 (Einfahrt + Parcoursüberwachung)"
    ersetzt: [tor5, parcours]
    ausrichtung: hoch
    bild: alcatraz_Parcours_klein
    bildGenerator: true    # aus alcatraz_Parcours erzeugt, das kleine Bild ohne Ziffern
    bildNeben: true
    summeSpalte: sum
    disq: parcours
    hinweis: parcours
    katalog: tor5
    spalten:
      - { key: fehler, label: "Fehler", typ: code, punkteSpalte: fp, breite: 1 }
      - { key: fp, label: "Fehlerpunkte", typ: summe, einzeln: true }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }
      - { key: bemerkung, label: "Bemerkung", typ: text, breite: 3 }

  # Dasselbe für Aufbauten, deren Tor-Listen kein Start/Ziel haben (Alcatraz-DM26):
  # Dort steckt es in der Parcoursliste und muss hier erhalten bleiben.
  - id: tor5puems
    titel: "Tor 5 + Parcours"
    menue: "Tor 5 (Einfahrt + Parcoursüberwachung mit Start und Ziel)"
    ersetzt: [tor5, parcoursms]
    ausrichtung: hoch
    bild: alcatraz_Parcours_klein
    bildGenerator: true    # aus alcatraz_Parcours erzeugt, das kleine Bild ohne Ziffern
    bildNeben: true
    summeSpalte: sum
    disq: parcours
    hinweis: parcours
    katalog: tor5
    spalten:
      - { key: start, label: "Start", typ: boje, sub: ["hin seiteA", "hin seiteB"] }
      - { key: ziel, label: "Ziel", typ: boje, sub: ["rueck seiteA", "rueck seiteB"] }
      - { key: fehler, label: "Fehler", typ: code, punkteSpalte: fp, breite: 1 }
      - { key: fp, label: "F-Pkt.", typ: summe, einzeln: true }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }
      - { key: bemerkung, label: "Bemerkung", typ: text, breite: 2 }

  - id: mueb
    titel: "Mann-über-Bord"
    menue: "Mann-über-Bord / Schikane"
    ausrichtung: hoch
    bild: mueb
    bildGenerator: true    # aus alcatraz_Parcours erzeugt
    # Beobachtet wird nur die Schikane (MüB): alle Tore, Start/Ziel, die Speedbojen
    # und die übrigen Nummern werden abgeblendet. Sichtbar bleiben der Fahrweg, die
    # Zeitnahme (zur Orientierung) und die „6“ der Schikane.
    abblenden: [Tor1, Tor2, Tor3, Tor4, Tor5, StartZiel, Speedboje_unten, Speedboje_oben]
    bildDrehung: 90
    bildBreite: 50         # die lange MüB-Legende gibt den Platz ohnehin her
    klassen: [4, 5, 6, 7]   # Mann-über-Bord erst ab Klasse 4
    summeSpalte: sum
    disq: mueb
    katalog: mueb
    spalten:
      - { key: fehler, label: "Fehler", typ: code, punkteSpalte: fp, breite: 1 }
      - { key: fp, label: "Fehlerpunkte", typ: summe, einzeln: true }
      - { key: sum, label: "Σ", typ: summe }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: bemerkung, label: "Bemerkung", typ: text, breite: 3 }

  - id: parcours
    titel: "Parcours"
    menue: "Parcours einfach (nur Fahrweg)"
    ausrichtung: hoch
    bild: alcatraz_Parcours_gross
    bildGenerator: true    # aus alcatraz_Parcours erzeugt: das ganze Bild, nur ohne den Rahmen der Quelle
    disq: parcours
    hinweis: parcours
    spalten:
      - { key: bemerkung, label: "Bemerkung", typ: text, breite: 4 }
      - { key: disq, label: "Disq.", typ: disq }

  - id: parcoursms
    titel: "Parcours"
    menue: "Parcours einfach mit Start und Ziel"
    schnellauswahl: true   # in keinem Aufbau - nur über die Schnellauswahl
    ausrichtung: hoch
    bild: alcatraz_Parcours_gross
    bildGenerator: true    # aus alcatraz_Parcours erzeugt: das ganze Bild, nur ohne den Rahmen der Quelle
    disq: parcours
    hinweis: parcours
    spalten:
      - { key: start, label: "Start", typ: boje, sub: ["hin seiteA", "hin seiteB"] }
      - { key: ziel, label: "Ziel", typ: boje, sub: ["rueck seiteA", "rueck seiteB"] }
      - { key: bemerkung, label: "Bemerkung", typ: text, breite: 4 }
      - { key: disq, label: "Disq.", typ: disq }

  - id: knoten
    titel: "Knoten"
    menue: "Knoten"
    schnellauswahl: true   # in jedem Aufbau wählbar: Die Gesamtliste zeigt die Knoten
    ausrichtung: quer
    lauf: false          # Knoten werden nur einmal abgenommen (kein Lauf)
    summeSpalte: sum
    hinweis: knoten
    spalten:
      - { key: webleinstek, label: "Webleinstek", typ: boje, breite: 1 }
      - { key: schotstek, label: "Schotstek", typ: boje, breite: 1 }
      - { key: palstek, label: "Palstek", typ: boje, breite: 1 }
      - { key: kreuzknoten, label: "Kreuzknoten", typ: boje, breite: 1 }
      - { key: klampe, label: "Klampe", typ: boje, breite: 1 }
      # - { key: stern, label: "*", typ: boje, breite: 1 }
      - { key: sum, label: "Σ", typ: summe }
      - { key: bemerkung, label: "Bemerkung", typ: text, breite: 3 }

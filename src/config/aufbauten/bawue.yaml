# =====================================================================
# Aufbau Baden-Württemberg
# =====================================================================
# Wird von `npm run config:sync` mit den anderen Dateien zu public/config/positionen.yaml
# zusammengeführt. Parameter: siehe src/config/aufbauten.yaml.

aufbauten:
  - id: bawue
    name: Baden-Württemberg
    positionen: [zeit, steg, bawueland1, bawueland2, bawuewasser1, bawuewasser2, knoten]

positionen:
  # === Aufbau BADEN-WÜRTTEMBERG: Tor-Positionen (Blick von den Seiten) ===
  - id: bawueland1
    titel: "Land 1"
    menue: "Land 1"
    ausrichtung: hoch
    bild: bawue_Land_1
    bildGenerator: true    # aus alcatraz_Parcours erzeugt (ENTWURF, Seiten prüfen)
    # Land-Seite beobachtet seiteB. Tor 1-3: je die seiteB-Boje (aus `innen`
    # abgeleitet). Start/Ziel seiteB = untere Boje. Tor 4/5, Schikane und
    # Speedbojen gehören nicht zu dieser Position → abgeblendet.
    abblenden: [Tor1_innen, Tor2_aussen, Tor3_innen, Tor4, Tor5, StartZiel_oben, Schikane, Speedboje_oben, Speedboje_unten]
    # bildDrehung: -90   # wie Alcatraz (90°), aber vom Gegenüber → +180° = -90° (Hochformat)
    summeSpalte: sum
    disq: parcours
    # hinweis: blickrichtung
    spalten:
      - { key: start, label: "Start", typ: boje, sub: ["hin seiteB"] }
      - { key: t1a, label: "Tor 1", typ: boje, sub: ["hin seiteB"], innen: seiteA }
      - { key: t2a, label: "Tor 2", typ: boje, sub: ["hin seiteB"], innen: seiteB }
      - { key: t3a, label: "Tor 3", typ: boje, sub: ["hin seiteB"], innen: seiteA }
      - { typ: trenner, design: "doppelt" }
      - { key: t3b, label: "Tor 3", typ: boje, sub: ["rueck seiteB"], innen: seiteA }
      - { key: t2b, label: "Tor 2", typ: boje, sub: ["rueck seiteB"], innen: seiteB }
      # Klasse 4 fährt auf der Rückfahrt nicht durch Tor 1.
      - { key: t1b, label: "Tor 1", typ: boje, sub: ["rueck seiteB"], innen: seiteA, klassen: ["E", 1, 2, 3, 5, 6, 7] }
      - { key: t1c, label: "Tor 1", typ: boje, sub: ["rueck seiteB"], innen: seiteA, klassen: [7] }
      - { key: ziel, label: "Ziel", typ: boje, sub: ["rueck seiteB"] }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }

  - id: bawueland2
    titel: "Land 2"
    menue: "Land 2"
    ausrichtung: hoch
    bild: bawue_Land_2
    bildGenerator: true    # aus alcatraz_Parcours erzeugt (ENTWURF, Seiten prüfen)
    # Land-Seite, hinterer Kursteil: Tor 4 (seiteB = innen) + Tor 5 = untere Boje
    # + untere Speedboje (Speedboje_unten). Tore 1-3, Start/Ziel, Schikane und die
    # obere Speedboje (Speedboje_oben) abgeblendet.
    abblenden: [Tor1, Tor2, Tor3, Tor4_aussen, Tor5_oben, StartZiel_oben, StartZiel_unten, Schikane, Speedboje_oben]
    # bildDrehung: -90   # wie Alcatraz (90°), aber vom Gegenüber → +180° = -90° (Hochformat)
    summeSpalte: sum
    disq: parcours
    # hinweis: blickrichtung
    katalog: tor5
    spalten:
      - { key: t4a, label: "Tor 4", typ: boje, sub: ["hin seiteB"], innen: seiteB }
      - { key: t5a, label: "Tor 5", typ: boje, sub: ["hin seiteB"] }
      - { typ: trenner, design: "doppelt" }
      - { key: dffehler, label: "Tor 5 tief", typ: code, punkteSpalte: dfsum, breite: 1 }
      - { key: dfsum, label: "Σ", typ: summe }
      - { typ: trenner, design: "doppelt" }
      - { key: t5b, label: "Tor 5", typ: boje, sub: ["rueck seiteB"] }
      - { key: t4b, label: "Tor 4", typ: boje, sub: ["rueck seiteB"], innen: seiteB }
      - { key: speed2, label: "Speed 2", typ: boje, klassen: [7] }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }

  - id: bawuewasser1
    titel: "Wasser 1"
    menue: "Wasser 1"
    ausrichtung: hoch
    bild: bawue_wasser_1
    bildGenerator: true    # aus alcatraz_Parcours erzeugt (ENTWURF, Seiten prüfen)
    # Wasser-Seite beobachtet seiteA (Gegenseite zu Land 1). Tor 1-3: je die
    # seiteA-Boje. Start/Ziel seiteA = obere Boje. Schikane (MüB) wird hier
    # beobachtet → bleibt hell. Tor 4/5 + Speedbojen abgeblendet.
    abblenden: [Tor1_aussen, Tor2_innen, Tor3_aussen, Tor4, Tor5, StartZiel_unten, Speedboje_oben, Speedboje_unten]
    # bildDrehung: -90   # wie Alcatraz (90°), aber vom Gegenüber → +180° = -90° (Hochformat)
    summeSpalte: sum
    disq: mueb
    # hinweis: blickrichtung
    katalog: mueb
    spalten:
      - { key: start, label: "Start", typ: boje, sub: ["hin seiteA"] }
      - { key: t1a, label: "Tor 1", typ: boje, sub: ["hin seiteA"], innen: seiteA }
      - { key: t2a, label: "Tor 2", typ: boje, sub: ["hin seiteA"], innen: seiteB }
      - { key: t3a, label: "Tor 3", typ: boje, sub: ["hin seiteA"], innen: seiteA }
      - { typ: trenner, design: "doppelt" }
      - { key: t3b, label: "Tor 3", typ: boje, sub: ["rueck seiteA"], innen: seiteA }
      - { key: t2b, label: "Tor 2", typ: boje, sub: ["rueck seiteA"], innen: seiteB }
      - { key: fehler4, label: "MüB Fehler", typ: code, punkteSpalte: fp4, breite: 1, klassen: [4] }
      - { key: fp4, label: "MüB Punkte", typ: summe , klassen: [4] }
      - { key: t1b, label: "Tor 1", typ: boje, sub: ["rueck seiteA"], innen: seiteA, klassen: ["E", 1, 2, 3, 5, 6, 7] }
      - { key: fehler, label: "MüB Fehler", typ: code, punkteSpalte: fp, breite: 1, klassen: [5, 6, 7] }
      - { key: fp, label: "MüB Punkte", typ: summe, klassen: [5, 6, 7]  }
      - { key: t1c, label: "Tor 1", typ: boje, sub: ["rueck seiteA"], innen: seiteA, klassen: [7] }
      - { key: ziel, label: "Ziel", typ: boje, sub: ["rueck seiteA"] }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }

  - id: bawuewasser2
    titel: "Wasser 2"
    menue: "Wasser 2"
    ausrichtung: hoch
    bild: bawue_wasser_2
    bildGenerator: true    # aus alcatraz_Parcours erzeugt (ENTWURF, Seiten prüfen)
    # Wasser-Seite, hinterer Kursteil: Tor 4 (seiteA = außen) + Tor 5 = obere Boje
    # + nur die obere Speedboje (Speedboje_oben). Tore 1-3, Start/Ziel, Schikane und die
    # untere Speedboje (Speedboje_unten) abgeblendet.
    abblenden: [Tor1, Tor2, Tor3, Tor4_innen, Tor5_unten, StartZiel_oben, StartZiel_unten, Schikane, Speedboje_unten]
    # bildDrehung: -90   # wie Alcatraz (90°), aber vom Gegenüber → +180° = -90° (Hochformat)
    summeSpalte: sum
    disq: parcours
    # hinweis: blickrichtung
    katalog: tor5
    spalten:
      - { key: t4a, label: "Tor 4", typ: boje, sub: ["hin seiteA"], innen: seiteB }
      # - { typ: trenner, design: "gepunktet" }
      - { key: t5a, label: "Tor 5", typ: boje, sub: ["hin seiteA"] }
      - { typ: trenner, design: "doppelt" }
      - { key: t5b, label: "Tor 5", typ: boje, sub: ["rueck seiteA"] }
      # - { typ: trenner, design: "gepunktet" }
      - { key: t4b, label: "Tor 4", typ: boje, sub: ["rueck seiteA"], innen: seiteB }
      - { key: speed1, label: "Speed 1", typ: boje, klassen: [5, 6, 7] }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }

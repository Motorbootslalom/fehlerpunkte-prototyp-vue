# =====================================================================
# Aufbau Berlin
# =====================================================================
# Wird von `npm run config:sync` mit den anderen Dateien zu public/config/positionen.yaml
# zusammengeführt. Parameter: siehe src/config/aufbauten.yaml.

aufbauten:
  - id: berlin
    name: Berlin
    positionen: [steg, bstartziel, brechts, blinks]

positionen:
  # === Aufbau BERLIN: vier feste WKR-Positionen rund um den Kurs ===
  # Andere Zusammenstellung (z. B. Berlin): jede Position zeigt das GANZE
  # Parcoursbild mit allen Toren. Entwurf - Spalten/Bojen bitte prüfen.
  - id: bstartziel
    titel: "Start/Ziel"
    menue: "Start/Ziel (Zeitnahme + Start-/Zieltor-Bojen)"
    ausrichtung: hoch
    bild: berlin_startziel
    bildNeben: true
    bildGenerator: true    # aus alcatraz_Parcours erzeugt
    # Beobachtet werden das Start/Ziel-Tor (gelbe Bojen) und die Zeitnahme (schwarze
    # Bojen): alle Tore, die Schikane und die Speedbojen werden abgeblendet.
    abblenden: [Tor1, Tor2, Tor3, Tor4, Tor5, Schikane, Speedboje_unten, Speedboje_oben]
    summeSpalte: sum
    disq: parcours
    hinweis: blickrichtung
    spalten:
      - { key: zeit1, label: "Zeit 1", typ: zeit }
      - { key: zeit2, label: "Zeit 2", typ: zeit }
      - { key: zeit3, label: "Zeit 3", typ: zeit }
      - { key: start, label: "Start", typ: boje, sub: ["hin seiteA", "hin seiteB"] }
      - { key: ziel, label: "Ziel", typ: boje, sub: ["rueck seiteA", "rueck seiteB"] }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }

  - id: brechts
    titel: "Rechts"
    menue: "Rechts (Tor 1 / 3 + Mann-über-Bord)"
    ausrichtung: hoch
    bild: berlin_rechts
    bildNeben: true        # Start/Ziel links im Bild, wie von der rechten Seite gesehen
    bildGenerator: true    # aus alcatraz_Parcours erzeugt
    # Tor 1/3 bleiben hell (`hebt`), die Schikane (MüB) auch. Tor 2/4/5 folgen aus
    # `hebt`, zusätzlich werden Start/Ziel und die Speedbojen abgeblendet.
    abblenden: [StartZiel, Speedboje_unten, Speedboje_oben]
    summeSpalte: sum
    disq: mueb
    katalog: mueb
    hinweis: blickrichtung
    spalten:
      - { key: t1a, label: "Tor 1", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteB, hebt: Tor1 }
      - { key: t3a, label: "Tor 3", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteB, hebt: Tor3 }
      - { key: t3b, label: "Tor 3", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteB, hebt: Tor3 }
      # Klasse 4 fährt auf der Rückfahrt nicht durch Tor 1.
      - { key: t1b, label: "Tor 1", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteB, klassen: ["E", 1, 2, 3, 5, 6, 7], hebt: Tor1 }
      # Mann-über-Bord erst ab Klasse 4.
      - { key: mueb, label: "MüB", typ: code, punkteSpalte: mp, breite: 1, klassen: [4, 5, 6, 7] }
      - { key: mp, label: "F-Pkt.", typ: summe, einzeln: true, klassen: [4, 5, 6, 7] }
      # Klasse 7 fährt nach Mann-über-Bord und der Speedrunde ein drittes Mal durch Tor 1.
      - { key: t1c, label: "Tor 1", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteB, klassen: [7] }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }

  - id: blinks
    titel: "Links"
    menue: "Links (Tor 2 / 4 / 5 + Speedbojen)"
    ausrichtung: hoch
    bild: berlin_links
    bildNeben: true
    bildDrehung: 180       # Start/Ziel rechts im Bild, wie von der linken Seite gesehen
    bildGenerator: true    # aus alcatraz_Parcours erzeugt
    # Tor 2/4/5 bleiben hell (`hebt`), die Speedbojen auch. Tor 1/3 folgen aus
    # `hebt`, zusätzlich werden Start/Ziel und die Schikane abgeblendet.
    abblenden: [StartZiel, Schikane]
    summeSpalte: sum
    disq: parcours
    hinweis: blickrichtung
    katalog: tor5
    spalten:
      - { key: t2a, label: "Tor 2", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteA, hebt: Tor2 }
      - { key: t4a, label: "Tor 4", typ: boje, sub: ["hin seiteA", "hin seiteB"], innen: seiteA, hebt: Tor4 }
      - { key: t5, label: "Tor 5", typ: boje, sub: ["hin seiteA", "hin seiteB", "rueck seiteA", "rueck seiteB"], hebt: Tor5 }
      - { key: fehler, label: "Tor 5 Fehler", typ: code, punkteSpalte: fp, breite: 0.75 }
      - { key: fp, label: "F-Pkt.", typ: summe, einzeln: true }
      - { key: t4b, label: "Tor 4", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteA, hebt: Tor4 }
      - { key: t2b, label: "Tor 2", typ: boje, sub: ["rueck seiteA", "rueck seiteB"], innen: seiteA, hebt: Tor2 }
      # Speed nur je Klasse: Klasse 5/6 eine Boje, Klasse 7 zwei, darunter keine.
      - { key: speed1, label: "Sp. 1", typ: boje, klassen: [5, 6, 7] }
      - { key: speed2, label: "Sp. 2", typ: boje, klassen: [7] }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }

      "Sp. 1": "Sp. 1"
      "Sp. 2": "Sp. 2"
      "Fehler": "Penalty"
      "Tor 5 Fehler": "Gate 5 penalty"
      "Fehler AB": "Penalty AB"
      "Fehler AN": "Penalty AN"
      "F-Pkt. AB": "Pen. AB"
      "F-Pkt. AN": "Pen. AN"
      "Fehlerpunkte": "Penalties"
